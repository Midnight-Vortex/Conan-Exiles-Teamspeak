name: CI

# V8 safety net: run the host unit tests and the MinGW cross-build on every
# push and pull request so no change lands without "tests green + DLL links".
# The Windows MSVC build (build.ps1) stays the release build; this only gates.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (gcc + MinGW-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Run host unit tests
        run: bash tests/run_tests.sh

      - name: MinGW cross-build (full plugin DLL)
        run: bash build/build_mingw.sh
